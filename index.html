    // 1. Particle Background Logic
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.speedY = (Math.random() - 0.5) * 0.8;
            this.color = Math.random() > 0.5 ? 'rgba(0, 255, 204, ' : 'rgba(243, 208, 120, ';
            this.alpha = Math.random() * 0.6 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.fillStyle = this.color + this.alpha + ')';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 55; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 2. Web Audio Synthesizer for Custom Sound Effects

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);

                    n2 = [0, 1, 2, 3, 4][(seed * 3) % 5];
                } else {
                    n1 = [0, 1, 2, 3, 4][(seed + history[0]) % 5];
                    n2 = [5, 6, 7, 8, 9][(seed * 7) % 5];
                }

                currentActive = { period: nextP, size: trend, n1: n1, n2: n2 };
                
                document.getElementById('res').innerText = trend;
                document.getElementById('res').style.color = trend === 'BIG' ? '#ff0055' : '#00ff66';
                document.getElementById('n1').innerText = n1;
                document.getElementById('n2').innerText = n2;
                document.getElementById('nextP').innerText = nextP.slice(-4);
            }
            lastProcessed = issue;
        } catch(e) {
            console.log("Engine sync state: Re-trying...");
        }
    }

    // 6. Realtime History Table Render with Custom Slide Class
    function updateTable() {
        let h = "";
        sessionData.forEach((i, index) => {
            let animClass = index === 0 ? "history-row-new" : "";
            h += `<tr class="${animClass}">
                <td>${i.p}</td>
                <td style="color: var(--neon-gold);">${i.num}</td>
                <td style="color:${i.s === 'BIG' ? '#ff0055' : '#00ff66'}">${i.s}</td>
                <td>${i.res}</td>
            </tr>`;
        });
        document.getElementById('session-h').innerHTML = h;
    }

    // 7. Dynamic Modal Animation Handler
    function triggerResultModal(type, period, number) {
        const modal = document.getElementById('resultModal');
        const card = document.getElementById('modalCard');
        const mIcon = document.getElementById('mIcon');
        const mTitle = document.getElementById('mTitle');
        const mDesc = document.getElementById('mDesc');

        card.className = "modal-card";

        if (type === "WIN") {
            card.classList.add("modal-win");
            mIcon.innerHTML = "🗡️";
            mTitle.innerText = "VICTORY WIN";
            mDesc.innerText = `Period #${period} Result: ${number} (SUCCESS)`;
        } else if (type === "LOSS") {
            card.classList.add("modal-loss");
            mIcon.innerHTML = "👺";
            mTitle.innerText = "SYSTEM LOSS";
            mDesc.innerText = `Period #${period} Result: ${number} (RETRY)`;
        } else if (type === "JACKPOT") {
            card.classList.add("modal-jackpot");
            mIcon.innerHTML = "🎰";
            mTitle.innerText = "JACKPOT HIT";
            mDesc.innerText = `Period #${period} Number Hit: ${number}!`;
        }

        modal.classList.add('active');

        // Auto close after 3.5s if not clicked
        setTimeout(() => {
            closeModal();
        }, 3500);
    }

    function closeModal() {
        document.getElementById('resultModal').classList.remove('active');
    }
</script>
</body>
</html>
