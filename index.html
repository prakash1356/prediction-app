
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Dashboard</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#0f172a;color:white;padding:20px;
}
.card{
 max-width:500px;margin:30px auto;
 background:#1e293b;padding:25px;border-radius:20px;
 box-shadow:0 8px 30px #0004;
}
h1{text-align:center;color:#38bdf8}
.subtitle{text-align:center;color:#94a3b8}
.box{
 background:#0f172a;border-radius:14px;padding:20px;
 text-align:center;margin:20px 0;
}
.result{font-size:40px;font-weight:bold;color:#22c55e}
button{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:#38bdf8;color:#07111f;font-size:18px;
 font-weight:bold;margin-top:12px;
}
.small{color:#94a3b8;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>⚡ Prediction Dashboard</h1>
<p class="subtitle">Personal Demo Prediction System</p>

<div class="box">
<p>Demo Result</p>
<div class="result" id="result">---</div>
<p id="info">Generate पर क्लिक करें</p>
</div>

<button onclick="generate()">Generate Prediction</button>
<button onclick="resetData()">Reset</button>

<p class="small">
यह केवल demo random generator है। वास्तविक परिणाम की
गारंटी नहीं है और इसे betting के लिए भरोसेमंद न मानें।
</p>
</div>

<script>
function generate(){
 const choices=["RED","GREEN","BLUE"];
 const result=choices[Math.floor(Math.random()*choices.length)];
 document.getElementById("result").innerText=result;
 document.getElementById("info").innerText=
 "Demo result generated: "+new Date().toLocaleTimeString();
}
function resetData(){
 document.getElementById("result").innerText="---";
 document.getElementById("info").innerText="Generate पर क्लिक करें";
}
</script>
</body>
  </html>
