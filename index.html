<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PRAKASH HACKED</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#078cff;--purple:#7b2cff;--pink:#ff1493;--green:#19d77a;--red:#ff315c;--text:#18233a;--muted:#71809a;--border:#d9e5f5}*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{background:radial-gradient(circle at 10% 5%,rgba(0,145,255,.12),transparent 28%),radial-gradient(circle at 90% 20%,rgba(255,20,147,.1),transparent 30%),linear-gradient(180deg,#fafdff,#eef5ff);font-family:Rajdhani,sans-serif;color:var(--text);min-height:100vh;padding:12px;display:flex;justify-content:center}#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.app{width:100%;max-width:420px;z-index:1;display:flex;flex-direction:column;gap:13px;padding-bottom:20px}.logo{text-align:center;font:900 33px Orbitron,sans-serif;letter-spacing:3px;background:linear-gradient(90deg,#172238,#147ee8,#08aeea,#172238);background-clip:text;color:transparent;margin:26px 0 8px}.login,.period,.pred,.history{background:rgba(255,255,255,.95);border:1px solid var(--border);box-shadow:0 10px 30px rgba(45,90,140,.12);border-radius:26px}.login{padding:28px 22px;text-align:center}.label{font:800 12px Orbitron;letter-spacing:2px;color:var(--purple);margin-bottom:18px}.input{width:100%;padding:16px;border:1px solid #cddcf0;border-radius:15px;background:#f7faff;font:700 16px Orbitron;text-align:center;margin-bottom:14px}.btn{width:100%;border:0;border-radius:15px;padding:15px;color:white;font:900 14px Orbitron;letter-spacing:1px;background:linear-gradient(90deg,#087cff,#7131e8,#ed168e)}#dash{display:none;flex-direction:column;gap:13px}.period{padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.p-label{font:800 11px Orbitron;color:var(--muted)}.pval{font:900 25px Orbitron;color:#182238;margin-top:7px}.timer{font:900 29px Orbitron;color:#12c86d;border-left:1px solid #dce6f2;padding-left:18px}.pred{min-height:300px;padding:35px 15px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}.pred:before{content:'';position:absolute;top:0;left:12%;width:76%;height:4px;border-radius:20px;background:linear-gradient(90deg,#09a5ff,#7430e9,#ff168e)}.sizeword{font:900 60px Orbitron;letter-spacing:2px;margin:12px 0 22px;color:#64748b}.balls{display:flex;gap:22px}.ball{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#535b69,#202632 65%,#11151c);border:3px solid #078cff;display:flex;align-items:center;justify-content:center;font:900 28px Orbitron;color:#8b39ff;box-shadow:0 6px 15px rgba(25,40,65,.28),0 0 0 4px rgba(0,145,255,.08)}.ball.small{border-color:#ff168d}.hint{margin-top:20px;color:#71809a;text-align:center;font-size:12px;font-weight:700}.history{padding:15px;overflow:auto;max-height:45vh}table{width:100%;border-collapse:collapse}th{font:800 10px Orbitron;color:#667895;padding:9px 4px}td{text-align:center;padding:11px 4px;border-bottom:1px solid #edf2f8;font-size:14px;font-weight:700}.tag{display:inline-block;padding:4px 8px;border-radius:8px;background:#eef5ff;color:#33415b}.msg{font-size:12px;color:#71809a;text-align:center;padding:10px}.status{font-size:12px;text-align:center;color:#64748b;font-weight:700}.err{color:#e11d48;font-weight:700;margin-top:10px}.analysis{background:#fff;border-radius:15px;padding:12px;color:#50617b;font-size:12px;text-align:center}.btn2{padding:10px;border:1px solid var(--border);border-radius:10px;background:#f5f9ff;color:#33415b;font-weight:800;margin-top:8px}
</style></head><body><canvas id="bg"></canvas><main class="app"><div class="logo">PRAKASH HACKED</div><section class="login" id="login"><div class="label">SYSTEM PROTOCOL LOCKED</div><input class="input" id="pw" type="password" placeholder="ENTER ACCESS KEY"><button class="btn" onclick="auth()">ACTIVATE SYSTEM</button><div id="error" class="err"></div><div class="msg">Personal demo interface</div></section>
<section id="dash"><div class="period"><div><div class="p-label">NEXT PERIOD</div><div class="pval" id="period">----</div></div><div class="timer" id="timer">00:00</div></div><div class="pred"><div id="size" class="sizeword">WAIT</div><div class="balls"><div class="ball" id="bigBall">?</div><div class="ball small" id="smallBall">?</div></div><div class="hint">Random example candidates • not predictions</div></div><div class="status" id="status">Connecting to results source…</div><div class="analysis" id="stats">Outcome tracker: waiting for the next completed period.</div><div class="history"><table><thead><tr><th>PERIOD</th><th>NUM</th><th>SIZE</th><th>COLOR</th><th>STATUS</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
function auth(){if(document.getElementById('pw').value==='Prakash@97'){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='flex';start()}else document.getElementById('error').textContent='Invalid password'}
const API='https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';let seen='', active=null, tracked={}, outcomeRows=[];
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function color(n){return n===0||n===5?'Violet':([1,3,7,9].includes(n)?'Green':'Red')}
function tick(){let s=new Date().getSeconds();document.getElementById('timer').textContent='00:'+String(60-s).padStart(2,'0')}
async function load(){try{let r=await fetch(API+'?t='+Date.now());if(!r.ok)throw Error();let d=await r.json(),list=d?.data?.list;if(!list?.length)throw Error();let latest=list[0],issue=latest.issueNumber,next=(BigInt(issue)+1n).toString();document.getElementById('period').textContent=next.slice(-4);
// Check the saved candidate against the completed result for its target period.
if(active && String(issue)===String(active.target) && !tracked[String(issue)]){let n=Number(latest.number),actualSize=n>=5?'BIG':'SMALL',result=actualSize===active.size?'WIN':'LOSS';tracked[String(issue)]=true;outcomeRows.unshift({period:String(issue).slice(-4),num:n,size:actualSize,color:color(n),status:result});if(outcomeRows.length>15)outcomeRows.pop();}
if(next!==seen){seen=next;let chosen=Math.random()>.5?'BIG':'SMALL';document.getElementById('size').textContent=chosen;document.getElementById('size').style.color=chosen==='BIG'?'#ff0055':'#00b96b';document.getElementById('bigBall').textContent=rnd(5,9);document.getElementById('smallBall').textContent=rnd(0,4);active={target:next,size:chosen};}
document.getElementById('status').textContent='Live history feed connected • '+new Date().toLocaleTimeString();
let base=list.slice(0,15).map(x=>{let n=Number(x.number),sz=n>=5?'BIG':'SMALL',status=tracked[String(x.issueNumber)]?((outcomeRows.find(z=>z.period===String(x.issueNumber).slice(-4))||{}).status||'—'):'—';return `<tr><td>${String(x.issueNumber).slice(-4)}</td><td>${n}</td><td><span class="tag">${sz}</span></td><td>${color(n)}</td><td>${status==='WIN'?'<span style="color:#0ca968;font-weight:900">WIN</span>':status==='LOSS'?'<span style="color:#e11d48;font-weight:900">LOSS</span>':'—'}</td></tr>`}).join('');document.getElementById('rows').innerHTML=base;
let nums=list.slice(0,20).map(x=>Number(x.number)),b=nums.filter(x=>x>=5).length,small=nums.length-b;let w=outcomeRows.filter(x=>x.status==='WIN').length,l=outcomeRows.filter(x=>x.status==='LOSS').length;document.getElementById('stats').textContent=`Last ${nums.length}: BIG ${b} (${Math.round(b/nums.length*100)}%) • SMALL ${small} (${Math.round(small/nums.length*100)}%). Tracker: ${w} WIN / ${l} LOSS. This records outcomes, not a reliable prediction.`}catch(e){document.getElementById('status').textContent='Live source unavailable right now. Retrying…'}}
function start(){tick();setInterval(tick,1000);load();setInterval(load,5000)}
// decorative particle background
const c=document.getElementById('bg'),ctx=c.getContext('2d');let ps=[];function resize(){c.width=innerWidth;c.height=innerHeight;ps=Array.from({length:45},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+1}))}resize();addEventListener('resize',resize);function anim(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;ctx.fillStyle='rgba(0,190,180,.35)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(anim)}anim();
</script></body></html>
